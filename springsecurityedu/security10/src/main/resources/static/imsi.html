<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
<h1>JWT 기반 로그인 기능 테스트</h1>
<hr>
<div id="loginarea">
	<form>
		계정 <input id="un" type="text"  placeholder="계정입력"><br>
		암호 <input id="pw" type="password"  placeholder="패스워드입력"><br>
		<input type="submit" value="로그인" onclick="requestToken(); return false;"><br>
	</form>
</div>
<hr>
<div id="checkarea">
	<button onclick="readToken();">JWT 읽어보기</button>
	<button onclick="checkToken();">로그인 상태 확인</button>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
	function readToken() {
    	return alert(localStorage.getItem('jwtToken'));
	}

	function requestToken() { 
    	$.ajax({
    	    url: '/auth2',
    	    method: 'POST',
    	    data: JSON.stringify({ username: $("#un").val(), password: $("#pw").val() }),
    	    contentType: "application/json",
    	    success: function(data, textStatus, jqXHR) {
    	        // 'Authorization' 헤더에서 JWT 토큰 추출
    	        let jwtToken = jqXHR.getResponseHeader('Authorization');
    	        if(jwtToken) {
    	            // Bearer 접두어를 제거하는 경우
    	            jwtToken = jwtToken.replace(/^Bearer\s+/i, '');
    	            localStorage.setItem('jwtToken', jwtToken);
    	            console.log("JWT 토큰 저장 완료:", jwtToken);
    	            $("#un").val(""); $("#pw").val();
    	            alert("로그인 성공");
    	        } else {
    	            console.error("JWT 토큰이 응답 헤더에 없습니다.");
    	        }
    	    },
    	    error: function(jqXHR, status, error) {
    	        console.error('요청 오류:', error);
    	    }
    	});
	}
	
	function checkToken() {
		// AJAX 요청에서 토큰을 Authorization 헤더에 실어 보내기
		$.ajax({
	    	url: '/auth3',
	    	method: 'GET',            
	    	contentType: "application/json",
	    	beforeSend: function(xhr) {
	        	let token =  localStorage.getItem('jwtToken');
	        	if (token) {
	            	xhr.setRequestHeader("Authorization", "Bearer " + token);
	        	}
	    	},
	    	success: function(response) {
	        	console.log("서버 응답:", response);
	        	alert(response);
	    	},
	    	error: function(xhr, status, error) {
	        	console.error("에러:", error);
	    	}
		});
	}
</script>
</body>
</html>
